# AI Sandbox engine — you normally don't edit this file.
# Project settings live in ../sandbox.yml, the network allowlist in ../allowlist.txt.
# Always started through ../sandbox (or ../sandbox.cmd → ../sandbox.cs), which adds a generated
# file with the project mounts, the container group name and the UI port.
#
#   host browser ──► 127.0.0.1:<port> ──► gateway ──► desktop (KDE)
#                                                       │  internal network:
#                                                       │  no internet route, no external DNS
#                                                       ▼
#                                                     proxy (tinyproxy + allowlist) ──► internet
#
# Relative paths are relative to the .sandbox folder (--project-directory).

networks:
  sandbox:            # desktop <-> proxy/gateway; NO internet route
    internal: true
  egress: {}          # proxy -> internet
  ui: {}              # gateway -> published localhost port

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  volumes:
    - .:/sandbox:ro   # tinyproxy.conf + allowlist.txt

services:
  proxy:
    <<: *hardened
    build: ./engine/proxy
    command: ["tinyproxy", "-d", "-c", "/sandbox/engine/proxy/tinyproxy.conf"]
    networks: [sandbox, egress]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # only reachable if allowlisted
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "3128"]
      interval: 10s
      timeout: 3s
      retries: 3

  gateway:
    <<: *hardened
    build: ./engine/proxy
    command: ["socat", "TCP-LISTEN:3001,fork,reuseaddr", "TCP:desktop:3001"]
    networks: [sandbox, ui]
    # ports: added by the generated file (127.0.0.1 only)
    depends_on: [proxy]

  desktop:
    build: ./engine/desktop      # INSTALL_* build args come from sandbox.yml
    hostname: sandbox
    shm_size: 1gb
    environment:
      TITLE: AI Sandbox
      SANDBOX_SUDO: "true"
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
    volumes:
      - home:/config            # persistent home: logins, IDE settings, Toolbox IDEs
      # project mounts: added by the generated file
    networks: [sandbox]
    mem_limit: 8g
    pids_limit: 4096
    depends_on: [proxy]
    restart: unless-stopped
    healthcheck:
      # Ready = web UI answers AND the KDE shell is running (avoids the
      # "first page load fails" race when the browser opens too early).
      test: ["CMD-SHELL", "curl -skf -o /dev/null https://localhost:3001/ && pgrep -f plasmashell >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 180s

volumes:
  home:
