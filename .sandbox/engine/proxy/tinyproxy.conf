# tinyproxy configuration for the AI sandbox.
# You normally never need to touch this file: edit ../../allowlist.txt instead.

Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 200

# Log to stdout ("docker compose logs proxy"). "Connect" logs every
# allowed connection and every refused one ("refused on filtered domain").
LogLevel Connect

DisableViaHeader Yes

# Only containers on the private Docker networks may use the proxy.
# (The proxy port is never published to the host.)
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# --- Allowlist ---------------------------------------------------------------
# FilterDefaultDeny Yes turns the filter file into an ALLOWLIST:
# only hosts matching a line in allowlist.txt can be reached.
Filter "/sandbox/allowlist.txt"
FilterType fnmatch
FilterDefaultDeny Yes

# HTTPS tunnels (CONNECT) only to port 443.
ConnectPort 443
