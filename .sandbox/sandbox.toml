# =============================================================================
#  Sandbox settings for this project — commit this file.
# =============================================================================
#  Apply:          sandbox up
#  Tools changed?  sandbox rebuild
#  Check:          sandbox info        (shows what was read from this file)
#  Docs:           https://github.com/highstreeto/AISandbox#readme

[project]
# name = "myproject"        # container group name (default: project folder name)
workspace = "rw"            # "rw" | "ro"   access to the project folder
protect_git = true          # .git/config + .git/hooks read-only (prevents planting
                            # hooks that would run on your host)
# ui_port = 3001            # fixed localhost port (default: random free port)

# Tools baked into the image. true = default version, false = don't install,
# "x" = a version, [..] = a list. Run "sandbox rebuild" after changing them.
[tools]
claude      = true          # Claude Desktop app (beta on Linux)
claude_code = false         # Claude Code CLI: true | "latest"
dotnet      = "10.0"        # .NET SDK channel(s), e.g. ["10.0", "8.0"]
node        = false         # Node.js major version, e.g. 24 (true = 24)
bun         = true
vscode      = true
jetbrains   = false         # e.g. "rider" or ["toolbox", "rider", "idea"]
                            #   toolbox rider idea pycharm webstorm clion goland
                            #   rustrover datagrip phpstorm rubymine
apt         = []            # extra Ubuntu packages, e.g. ["build-essential", "python3-pip"]

[desktop]
title  = "AI Sandbox"
sudo   = true               # false = no root inside (once tools are installed)
memory = "8g"
# cpus = 4                  # must not exceed the host's core count
# timezone = "Europe/Vienna"            # default: taken from the host
# devices = ["/dev/dri:/dev/dri"]       # GPU (Intel/AMD, Linux)
# security_opt = ["seccomp=unconfined"] # if GUI apps crash
# auth = { user = "me", password = "secret" }   # basic auth for the web desktop

# Extra environment variables in the desktop.
[env]
# MY_VAR = "value"

# Extra folders for the sandbox, one [[share]] block each.
# Revoke = remove the block + "sandbox up".
# [[share]]
# host = "../reference-docs"   # on this machine; relative to the project folder
# path = "/shares/docs"        # in the sandbox (default: /shares/<folder name>)
# readonly = true              # default: true
