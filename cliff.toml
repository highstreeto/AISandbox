# git-cliff: release notes, CHANGELOG.md and the next version, all from Conventional Commits
# (https://www.conventionalcommits.org). See AGENTS.md, "Releases".
#
#   feat: …   → Added,   minor bump        fix: …   → Fixed, patch bump
#   refactor/perf: … → Changed, patch      docs/test/ci/build/chore/style: … → not listed, no release
#   feat!: … or a "BREAKING CHANGE:" footer → major bump (minor while the version is 0.x)
#   Anything else (e.g. the commits before the switch) → Other, patch bump.

[changelog]
header = """
# Changelog

All notable changes to this project. Generated from the commit messages by git-cliff.\n
"""
body = """
## [{{ version | default(value="unreleased") | trim_start_matches(pat="v") }}]\
{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# The `<!-- n -->` prefixes only fix the order of the sections; `striptags` removes them.
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^(refactor|perf)", group = "<!-- 2 -->Changed" },
    { message = "^(docs|test|ci|build|chore|style)(\\(.*\\))?!?:", skip = true },
    { message = ".*", group = "<!-- 3 -->Other" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
