# nginx configuration of the local LLM gateway.
# Engine file: it is part of the app and baked into the llm image.
#
# desktop --> this gateway --> ollama. Only inference and read-only endpoints are passed on; everything else (pull,
# push, create, delete, copy, blobs) is refused, so the desktop can't use Ollama to download from other hosts.

load_module modules/ngx_http_js_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    # unprivileged and read-only: every temp path is under /tmp (a tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's DNS: ollama may get a new address when it restarts

    # QuickJS, not the built-in njs engine: that one is deprecated since njs 1.0.0 and lacks modern JavaScript
    # (for...of, ...). Needs njs 0.8.6 or newer, which the nginx images ship.
    js_engine qjs;
    js_import usage from usage.js;

    # Set by usage.filter from the response (see usage.js).
    js_var $usage_model  "";
    js_var $usage_in     "null";
    js_var $usage_out    "null";
    js_var $usage_stream "false";
    js_var $usage_buf    "";

    # One JSON line per inference request: read by "sandbox llm usage".
    log_format usage escape=json '{"ts":"$time_iso8601","path":"$uri","status":$status,"secs":$request_time,'
                                 '"model":"$usage_model","in":$usage_in,"out":$usage_out,"stream":$usage_stream}';
    log_format plain '$remote_addr "$request" $status $request_time';
    access_log /dev/stdout plain;

    client_max_body_size 64m;

    server {
        listen 11434;
        server_name _;

        set $upstream http://ollama:11434;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";   # the usage filter reads plain text
        proxy_buffering off;                   # streamed answers (SSE / NDJSON) go through as they come
        proxy_read_timeout 3600s;              # a big model can take minutes to load
        proxy_send_timeout 3600s;

        # Inference: passed on, usage logged.
        location ~ ^/(api/(chat|generate|embed|embeddings)|v1/(chat/completions|completions|embeddings|messages|messages/count_tokens))$ {
            access_log /var/log/llm/usage.jsonl usage;
            js_body_filter usage.filter buffer_type=buffer;
            proxy_pass $upstream;
        }

        # Read-only: the server, the installed models.
        location ~ ^/(api/(version|tags|show|ps)|v1/models(/.+)?)$ {
            proxy_pass $upstream;
        }

        location = / {
            proxy_pass $upstream;
        }

        location / {
            default_type application/json;
            return 403 '{"error":"blocked by the sandbox: models are managed on the host (run: sandbox llm pull <model>)"}';
        }
    }
}
