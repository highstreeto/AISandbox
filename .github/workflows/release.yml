# Every push to main: test, compute the next version from the Conventional Commits (cliff.toml), build the
# binaries and publish a GitHub release with the changelog. See AGENTS.md, "Releases".
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # releases run one after another and are never cancelled half-way

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Next version
        id: next
        # git cliff --bumped-version applies the rules in cliff.toml. It returns the current tag when nothing since
        # then is releasable (only docs/test/ci/build/chore/style commits); then there is no release.
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          tag=$(git cliff --bumped-version)
          release=true
          if [ -n "$last" ] && [ "$tag" = "$last" ]; then release=false; fi
          echo "last=${last:-none} tag=$tag release=$release"
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
      - name: Release notes and changelog
        if: steps.next.outputs.release == 'true'
        run: |
          git cliff --unreleased --tag "${{ steps.next.outputs.tag }}" --strip all -o notes.md
          git cliff --tag "${{ steps.next.outputs.tag }}" -o CHANGELOG.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.release == 'true'
        with:
          name: changelog
          path: |
            notes.md
            CHANGELOG.md

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, smoke: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, smoke: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, smoke: true }
          - { target: aarch64-apple-darwin, os: macos-latest, smoke: true }
          - { target: x86_64-apple-darwin, os: macos-latest, smoke: false }
    runs-on: ${{ matrix.os }}
    env:
      SANDBOX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --bin sandbox --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          exe=sandbox
          [[ "${{ matrix.target }}" == *windows* ]] && exe=sandbox.exe
          bin="target/${{ matrix.target }}/release/$exe"
          if [ "${{ matrix.smoke }}" = true ]; then
            # No `tee /dev/stderr`: Git Bash on the Windows runners has no /dev/stderr.
            version=$("$bin" --version)
            echo "$version"
            case "$version" in
              "sandbox $SANDBOX_RELEASE_VERSION+"*) ;;
              *) echo "::error::expected sandbox $SANDBOX_RELEASE_VERSION+<commit>, got: $version"; exit 1 ;;
            esac
          fi
          mkdir -p dist pkg
          cp "$bin" README.md LICENSE pkg/
          name="sandbox-${{ matrix.target }}"
          if [[ "$exe" == *.exe ]]; then
            cp "$bin" "dist/$name.exe"
            (cd pkg && 7z a -tzip "../dist/$name.zip" .)
          else
            cp "$bin" "dist/$name"
            (cd pkg && tar -czf "../dist/$name.tar.gz" *)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p assets
          cp artifacts/dist-*/* assets/
          cp install/install.sh install/install.ps1 artifacts/changelog/CHANGELOG.md assets/
          echo "${{ needs.version.outputs.version }}" > assets/VERSION
          (cd assets && sha256sum -- * > SHA256SUMS)
          ls -l assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file artifacts/changelog/notes.md
