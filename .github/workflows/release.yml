# Every push to main: test, compute the next version from the Conventional Commits (cliff.toml), build the
# binaries and publish a GitHub release with the changelog. See AGENTS.md, "Releases".
# The steps are xtask tasks (xtask/src/release.rs, output in target/dist/); `cargo xtask dist` runs them locally for
# this machine's target, without publishing.
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false # releases run one after another and are never cancelled half-way

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Next version, release notes and changelog
        id: next
        # Writes tag, version and release to $GITHUB_OUTPUT, and target/dist/notes.md and CHANGELOG.md.
        run: cargo xtask version
      - uses: actions/upload-artifact@v4
        if: steps.next.outputs.release == 'true'
        with:
          name: changelog
          path: |
            target/dist/notes.md
            target/dist/CHANGELOG.md

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest, options: --no-smoke } # an arm64 runner
    runs-on: ${{ matrix.os }}
    env:
      SANDBOX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build, smoke test (sandbox --version) and package
        run: cargo xtask package --target ${{ matrix.target }} ${{ matrix.options }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/files/*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: target/dist/files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: changelog
          path: target/dist
      - name: Collect assets (install scripts, CHANGELOG.md, VERSION, SHA256SUMS)
        env:
          SANDBOX_RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: cargo xtask assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" target/dist/assets/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file target/dist/notes.md
